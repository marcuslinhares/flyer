version: '3.8'

services:
  api:
    build: .
    container_name: flyer-api
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./pb_data:/app/pb_data
    environment:
      - DB_PATH=/app/data/flyer.db
      - UPLOAD_DIR=/app/uploads
      - PORT=8080
      - FLYER_API_KEY=${FLYER_API_KEY:-}
    restart: unless-stopped
